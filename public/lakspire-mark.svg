<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lakspire horizontal mark — LS monogram + LAKSPIRE wordmark.
  Golden gradient matches the client's reference. Serif via <text> so
  we don't ship a font file just for the logo; falls back gracefully
  on systems missing the ideal serif.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" role="img" aria-label="Lakspire">
  <defs>
    <linearGradient id="lk-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D28A"/>
      <stop offset="35%" stop-color="#E9B860"/>
      <stop offset="65%" stop-color="#C8963A"/>
      <stop offset="100%" stop-color="#8B6423"/>
    </linearGradient>
    <linearGradient id="lk-gold-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D28A"/>
      <stop offset="100%" stop-color="#B78A34"/>
    </linearGradient>
  </defs>

  <!-- LS monogram — stylized serif L with S woven through -->
  <g transform="translate(2 4)">
    <!-- L stem -->
    <path d="M6 2 h5 v26 h11 v4 h-16 z" fill="url(#lk-gold)"/>
    <!-- L serif top -->
    <path d="M4 2 h9 v3 h-9 z" fill="url(#lk-gold-soft)" opacity="0.85"/>
    <!-- S woven curl -->
    <path d="M22 6 c-4 0 -7 2.4 -7 6 c0 3 2.4 4.6 5.6 5.4 c3 0.8 4.4 1.6 4.4 3.2 c0 1.6 -1.8 2.6 -4 2.6 c-2.4 0 -4.2 -1 -5 -3 l-3 1.6 c1.4 3 4.2 4.6 8 4.6 c4.6 0 7.6 -2.4 7.6 -6 c0 -3.4 -2.4 -5 -6 -5.8 c-3 -0.7 -4 -1.4 -4 -2.8 c0 -1.4 1.6 -2.4 3.6 -2.4 c1.8 0 3.4 0.8 4.2 2.4 l3 -1.6 c-1.4 -2.6 -4 -4.2 -7.4 -4.2 z" fill="url(#lk-gold)"/>
  </g>

  <!-- Wordmark LAKSPIRE — Georgia/serif fallback keeps the editorial feel -->
  <text
    x="46" y="30"
    font-family="'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif"
    font-size="24"
    font-weight="500"
    letter-spacing="4"
    fill="url(#lk-gold)"
  >LAKSPIRE</text>

  <!-- Subtle underline flourish with diamond, echoing the source logo -->
  <g stroke="url(#lk-gold-soft)" stroke-width="0.8" opacity="0.7">
    <line x1="46" y1="38" x2="103" y2="38"/>
    <line x1="115" y1="38" x2="205" y2="38"/>
  </g>
  <path d="M109 38 l3 -3 l3 3 l-3 3 z" fill="url(#lk-gold-soft)" opacity="0.85"/>
</svg>
