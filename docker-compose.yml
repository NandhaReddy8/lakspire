services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lakspire}
      MYSQL_USER: ${MYSQL_USER:-lakspire_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, only against an empty data directory: creates the
      # two tables, then claws the auto-granted user back down to
      # SELECT/INSERT/UPDATE only. See docker/mysql/init/.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # Not published to the host — only the `app` service (on this
    # compose network) can reach it, at db:3306.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides the bare-metal DB_* values from .env (used by the
      # host PM2 deployment) so the containerized app talks to the
      # containerized database instead.
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-lakspire_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-lakspire}
    ports:
      # Host port is configurable since this box runs many apps —
      # set APP_PORT in .env if 3000 is already taken.
      - "${APP_PORT:-3000}:3000"

volumes:
  mysql_data:
